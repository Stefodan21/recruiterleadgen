name: leadgen-deploy

on:
    workflow_dispatch:
    pull_request:
        branches: ['prod']

concurrency:
    group: leadgen-deploy
    cancel-in-progress: true

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build search image
        run: docker build --no-cache -t search -f search/Dockerfile search
     
      - name: Run search
        run: >-
          docker run --name search-run
          -e GOOGLE_KEY='${{ secrets.GOOGLE_KEY }}'
          -e CX_ID='${{ secrets.CX_ID }}'
          -e S3_ACCESS_KEY_ID='${{ secrets.S3_ACCESS_KEY_ID }}'
          -e S3_SECRET_ACCESS_KEY='${{ secrets.S3_SECRET_ACCESS_KEY }}'
          -e S3_SEEN_BUCKET='${{ secrets.S3_SEEN_BUCKET }}'
          search:latest

      - name: Copy new_links.json from container
        run: docker cp search-run:/app/new_links.json ./new_links.json

      - name: Remove search container
        run: docker rm search-run

      - uses: actions/upload-artifact@v4
        with:
          name: new_links
          path: new_links.json


  ingestion:
    needs: search
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: new_links
          path: .

      - name: Build ingestion image
        run: >-
          docker build 
          -t ingestion 
          -f ingestion/Dockerfile ingestion

      - name: list image
        run: docker image list

      - name: Create ingestion container
        run: docker create --name ingestion-run ingestion:latest

      - name: Copy new_links.json into container
        run: >-
          docker cp ./new_links.json 
          ingestion-run:/app/new_links.json

      - name: Run ingestion container
        run: docker start -a ingestion-run

      - name: Copy raw_profiles.json from container
        run: >-
          docker cp ingestion-run:/app/raw_profiles.json
          ./raw_profiles.json

      - name: Remove ingestion container
        run: docker rm ingestion-run


      - uses: actions/upload-artifact@v4
        with:
          name: raw_profiles
          path: raw_profiles.json

  field_extraction:
    needs: ingestion
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: raw_profiles
          path: .

      - name: Build field extraction image
        run: docker build -t field-extraction ./field_extraction

          # FIXED: explicitly run the Rust binaries
      - name: Run extract_contact
        run: >-
          docker run --rm -i field-extraction 
          extract_contact < raw_profiles.json > contact_fields.json

      - name: Run map_fields
        run: >-
          docker run --rm -i field-extraction
          map_fields < contact_fields.json > extracted_fields.json

      - uses: actions/upload-artifact@v4
        with:
          name: extracted_fields
          path: .


  export:
    needs: field_extraction
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: extracted-fields

      - name: Build export image
        run: docker build -t export ./export
      - name: Export to Supabase
        run: |
          docker run --rm \
          -v ${{ github.workspace }}:/app \
          -e SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
          -e SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }} \
          export ts-node to_db.ts
